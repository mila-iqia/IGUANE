#                   FP32: 2617e6*24064*2/1e12          = 125.950976 TFLOPS (1   FP32 FMA per CUDA Core)
#                   FP64: 2617e6*188*2*2/1e12          =   1.967984 TFLOPS (2   FP64 FMA ALUs per SM, 1:64 of FP32)
#                   FP16: 2617e6*752*(4*4*8)*2/1e12    = 503.803904 TFLOPS (752 Tensor Cores contracting 4x4x8 mixed FP32 += FP16*FP16 FMAs/clock cycle @ 0% sparsity)
#                   TF32: 2617e6*752*(4*4*4)*2/1e12    = 251.901952 TFLOPS (752 Tensor Cores contracting 4x4x4 TF32 FMAs/clock cycle @ 0% sparsity, 1:2 of FP16)
