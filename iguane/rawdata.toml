##############################################################################
#####                            CALCULATIONS                            #####
##############################################################################
#
# FP64 is scalar FP64 throughput.
# FP32 is scalar FP32 throughput.
# FP16 is a measure of FP16 tensor math throughput, typified by mixed-precision FP16 multiplies with accumulation into FP32.
#   - Tensor Core FP16    throughput @ 0% sparsity with accumulation into FP32, if Tensor Cores supported with mixed FP16*FP16 multiply with accumulation into FP32;
#   - Packed FP16         throughput,                                           if Tensor Cores with mixed FP16*FP16 multiply with accumulation into FP32 unsupported but packed FP16*FP16 vector dot-product with accumulation into FP32 supported;
#   - Scalar FP32         throughput,                                           if neither Tensor Cores nor packed FP16 supported.
# TF32 is:
#   - Tensor Core TF32    throughput @ 0% sparsity with accumulation into FP32, if Tensor Core TF32 datatype supported;
#   - Scalar FP32         throughput,                                           if Tensor Core TF32 datatype not supported, or
#   - Throughput @ 0% sparsity (100% dense) of some easy-to-enable intermediate precision between FP16 and FP32, if superior to FP32.
# MEMGB is capacity  of GPU in gigabytes.
# MEMBW is bandwidth of GPU to global memory, in gigabytes/s.
# TDP   is Thermal Design Power, the expected maximum power dissipation of GPU in Watts.
#
#
# https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/tesla-product-literature/Tesla-K80-BoardSpec-07317-001-v05.pdf
