#             same per-CU throughput as MI300X (see ISA document above), 128GB HBM3 (8192-bit @ 5.2 GT/s = 5324.8 GB/s, same as MI300X)
#             FP32: 2100e6*14592*2*2/1e12           =  122.5728 TFLOPS (2 FP32 FMA per stream core (dual-issued))
