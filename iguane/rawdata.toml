#                   FP32: 2617e6*10752*2/1e12          =  56.275968 TFLOPS (1   FP32 FMA per CUDA Core)
#                   FP64: 2617e6*84*2*2/1e12           =   0.879312 TFLOPS (2   FP64 FMA ALUs per SM, 1:64 of FP32)
#                   FP16: 2617e6*336*(4*4*8)*2/2/1e12  = 112.551936 TFLOPS (336 Tensor Cores contracting 4x4x8 mixed FP32 += FP16*FP16 FMAs/2 clock cycles @ 0% sparsity)
#                   TF32: 2617e6*336*(4*4*4)*2/2/1e12  =  56.275968 TFLOPS (336 Tensor Cores contracting 4x4x4 TF32 FMAs/2 clock cycles @ 0% sparsity, 1:2 of FP16)
#     RTX-5090:     Die GB202, 88.5% enabled (170 SMs x 4 = 680 5th-gen Tensor Cores) @ Boost Clock 2407 MHz, 32 GB GDDR7, 1792 GB/s BW, 575W
#                   FP32: 2407e6*21760*2/1e12          = 104.75264  TFLOPS (1   FP32 FMA per CUDA Core)
#                   FP64: 2407e6*170*2*2/1e12          =   1.63676  TFLOPS (2   FP64 FMA ALUs per SM, 1:64 of FP32)
#                   FP16: 2407e6*680*(4*4*8)*2/2/1e12  = 209.50528  TFLOPS (680 Tensor Cores contracting 4x4x8 mixed FP32 += FP16*FP16 FMAs/2 clock cycles @ 0% sparsity)
#                   TF32: 2407e6*680*(4*4*4)*2/2/1e12  = 104.75264  TFLOPS (680 Tensor Cores contracting 4x4x4 TF32 FMAs/2 clock cycles @ 0% sparsity, 1:2 of FP16)
