#                FP16: 1830e6*528*(8*4*16)*2/1e12 = 989.42976 TFLOPS (528 Tensor Cores contracting 8x4x16 mixed FP32 += FP16*FP16 FMAs/clock cycle @ 0% sparsity)
#                TF32: 1830e6*528*(8*4*8)*2/1e12  = 494.71488 TFLOPS (528 Tensor Cores contracting 8x4x8  TF32 FMAs/clock cycle @ 0% sparsity, 1:2 of FP16)
#                (Appears to primarily be a memory upgrade of H100 SXM5, 80GB HBM3 -> 141GB HBM3e and with higher bandwidth)
#     H200 NVL:  Die GH100 (Identical to H100 NVL, see misteries)
#                FP32: 1785e6*16896*2/1e12        =  60.31872 TFLOPS (1   FP32 FMA per CUDA Core)
#                FP64: 1785e6*16896*2*0.5/1e12    =  30.15936 TFLOPS (0.5 FP64 FMA per CUDA Core, 1:2 of FP32)
#                FP16: 1545e6*528*(8*4*16)*2/1e12 = 835.33824 TFLOPS (528 Tensor Cores contracting 8x4x16 mixed FP32 += FP16*FP16 FMAs/clock cycle @ 0% sparsity)
#                TF32: 1545e6*528*(8*4*8)*2/1e12  = 417.66912 TFLOPS (528 Tensor Cores contracting 8x4x8  TF32 FMAs/clock cycle @ 0% sparsity, 1:2 of FP16)
#                (Appears to primarily be a memory upgrade of H100 NVL, 80GB HBM3 -> 141GB HBM3e and with higher bandwidth)
#
# https://images.nvidia.com/aem-dam/Solutions/geforce/blackwell/nvidia-rtx-blackwell-gpu-architecture.pdf
# https://www.nvidia.com/content/dam/en-zz/Solutions/design-visualization/quadro-product-literature/NVIDIA-RTX-Blackwell-PRO-GPU-Architecture-v1.0.pdf
#     B200 NVL:     Die GB200 (?), 186 GB HBM3e, 8000 GB/s BW, 1200W
#     B200 HGX:     Die GB200 (?), 180 GB HBM3e, 7700 GB/s BW, 1000W
